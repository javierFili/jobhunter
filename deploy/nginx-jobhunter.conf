# /etc/nginx/sites-available/jobhunter — sirve el SPA y hace de proxy a la API (puerto 8095, solo localhost)
# Certificado: sudo certbot --nginx -d tu-dominio.example
server {
    listen 80;
    server_name tu-dominio.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tu-dominio.example;

    ssl_certificate     /etc/letsencrypt/live/tu-dominio.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tu-dominio.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    client_max_body_size 6m;   # CV de hasta 5 MB

    root /var/www/jobhunter;   # salida de `npm run build` (frontend/dist)
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8095;
    }

    location / {
        try_files $uri /index.html;
    }
}
